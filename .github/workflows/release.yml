# Release: semantic-release tags and publishes the DMG committed under
# downloads/, once it has been checked. The website's download button links to
# releases/latest. ADR 0026.
#
# The version comes from the commit messages since the last tag (fix: a patch,
# feat: a minor, BREAKING CHANGE: a major), and the DMG is built on the
# owner's Mac, because the bundled Valhalla is compiled there (ADR 0013). So a
# release starts locally:
#
#   npm run release           # = release:prepare, then release:publish
#
#   npm run release:prepare   # works out the version, packages the DMG, commits both
#   npm run release:publish   # pushes, follows this workflow with gh, checks the release
#
# Here semantic-release works the version out again from the tags on GitHub,
# and refuses to go on if it is not the one the DMG was built as
# (scripts/release-verify.mjs). It checks the DMG on an Apple silicon runner
# (scripts/check-dmg.mjs), then tags the commit and publishes the release with
# notes made from the commits, the DMG and its checksum. release.config.mjs
# holds the rules.
#
# Every release tag must be on GitHub, not only on the Mac. Without them this
# workflow sees a first release and wants 1.0.0: that is how 0.2.0 failed twice,
# with v0.1.0 never pushed. The release scripts now check for it.

name: Release

on:
  push:
    branches: [main]
    # The release commit adds the DMG; nothing else starts a release.
    paths: ['downloads/*.dmg']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work out the version and check the DMG without publishing
        type: boolean
        default: false

permissions:
  # Pushes the tag and creates the release.
  contents: write
  # @just-ak/kiro-spec-handbook is installed from GitHub Packages.
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    # Explicit, so pipelines fail on any stage (bash -eo pipefail).
    shell: bash

jobs:
  release:
    # Apple silicon: the DMG is arm64 only, and the checks run its tools.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads every commit since the last tag.
          fetch-depth: 0
          # Only the DMG being released is needed from Git LFS, fetched below.
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          # Sends only the @just-ak scope to GitHub Packages.
          registry-url: https://npm.pkg.github.com
          scope: '@just-ak'

      - name: Check the release tags are here
        # semantic-release counts from the last tag; with none it would want 1.0.0.
        run: |
          last=$(git tag --list 'v*' --merged HEAD --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            echo "::error::No release tag (v*) is behind this commit, so this would be a first release (1.0.0). Push the last release tag from the Mac: git push origin refs/tags/<tag>"
            exit 1
          fi
          echo "Last release: $last"

      - name: Fetch the DMG for package.json's version from Git LFS
        id: dmg
        run: |
          version=$(node -p "require('./package.json').version")
          dmg="downloads/TrailRT-$version-arm64.dmg"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! git ls-files --error-unmatch "$dmg" > /dev/null 2>&1; then
            echo "::error::package.json says $version but $dmg is not committed. Run npm run release:prepare on the Mac."
            exit 1
          fi
          git lfs pull --include "$dmg"
          ls -l "$dmg"

      - name: Install the release tools
        # --ignore-scripts: semantic-release needs neither Electron's binary
        # nor the native rebuild that postinstall does.
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        run: npx --no-install semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the release
        if: ${{ !inputs.dry_run }}
        run: |
          tag="v${{ steps.dmg.outputs.version }}"
          gh release view "$tag" --json url,assets --jq '"\(.url)\n" + ([.assets[] | "  \(.name) (\(.size) bytes)"] | join("\n"))'
          {
            echo "### TrailRT $tag"
            echo
            gh release view "$tag" --json url --jq '"Published: " + .url'
            echo
            echo "Latest download: https://github.com/${{ github.repository }}/releases/latest"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
