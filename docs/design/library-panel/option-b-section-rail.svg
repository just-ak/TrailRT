  .on{fill:#ffffff} .onm{fill:#ffffff;fill-opacity:.75} .ph{fill:var(--ui-photo,#0d9488)}
  .rail{fill:none;stroke:var(--ui-text3,#94a3b8);stroke-width:2}
  .i{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .i2{stroke:var(--ui-text2,#475569)} .i3{stroke:var(--ui-text3,#94a3b8)} .ia{stroke:var(--ui-accent,#2563eb)}
  .iw{stroke:#ffffff} .ip{stroke:var(--ui-photo,#0d9488)} .ir{stroke:#7c3aed} .it{stroke:#ea580c} .iy{stroke:#dc2626}
  .lab{fill:var(--ui-text2,#475569);font-size:13px;font-weight:600}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<style>
