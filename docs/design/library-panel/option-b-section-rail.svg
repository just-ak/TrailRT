<title id="option-b-section-rail-t">Option B, Section rail</title>
<desc id="option-b-section-rail-d">An icon rail switches between Trips, Routes, Tracks, Waypoints, Photos, Imported and Recent; each section has its own list, and Photos is a grid.</desc>

