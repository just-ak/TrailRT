<text x="50" y="1052" class="t1" font-size="13" font-weight="400" text-anchor="start" >13 Nov 2026, 18:15</text>
<line x1="506" y1="52" x2="530" y2="52" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="540" cy="52" r="10" class="co"/>
<text x="540" y="56" class="cot" font-size="11" font-weight="700" text-anchor="middle" >1</text>
<text x="560" y="57" class="t1" font-size="14" font-weight="700" text-anchor="start" >Editing hides the day</text>
<text x="560" y="77" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >The pencil swaps the trip by the hour for this form.</text>
<text x="560" y="95" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >You edit the plan without seeing it, and go Back</text>
<text x="560" y="113" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >to check what changed.</text>
<line x1="506" y1="182" x2="530" y2="182" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="540" cy="182" r="10" class="co"/>
<text x="540" y="186" class="cot" font-size="11" font-weight="700" text-anchor="middle" >2</text>
<text x="560" y="187" class="t1" font-size="14" font-weight="700" text-anchor="start" >Description and notes lead</text>
<text x="560" y="207" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >The two biggest boxes sit at the top, and are</text>
<text x="560" y="225" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >rarely used. The plan starts 620 px down.</text>
<line x1="506" y1="434" x2="530" y2="434" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="540" cy="434" r="10" class="co"/>
<text x="540" y="438" class="cot" font-size="11" font-weight="700" text-anchor="middle" >3</text>
<text x="560" y="439" class="t1" font-size="14" font-weight="700" text-anchor="start" >Facts that cannot be edited</text>
<text x="560" y="459" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >Status, “1 waypoints” and Created are read-only.</text>
<text x="560" y="477" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >The trip page already shows the counts.</text>
<line x1="506" y1="596" x2="530" y2="596" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="540" cy="596" r="10" class="co"/>
<text x="540" y="600" class="cot" font-size="11" font-weight="700" text-anchor="middle" >4</text>
<text x="560" y="601" class="t1" font-size="14" font-weight="700" text-anchor="start" >Eight buttons without words</text>
<text x="560" y="621" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >Contents and the itinerary each have a row of</text>
<text x="560" y="639" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >icons. Import and export repeat the trip page’s.</text>
<line x1="506" y1="778" x2="530" y2="778" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="540" cy="778" r="10" class="co"/>
<text x="540" y="782" class="cot" font-size="11" font-weight="700" text-anchor="middle" >5</text>
<text x="560" y="783" class="t1" font-size="14" font-weight="700" text-anchor="start" >A stop is a list row</text>
<text x="560" y="803" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >Arrive, stay and leave are hidden until a stop</text>
<text x="560" y="821" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >is opened; reordering is up and down arrows.</text>
<line x1="506" y1="894" x2="530" y2="894" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="540" cy="894" r="10" class="co"/>
<text x="540" y="898" class="cot" font-size="11" font-weight="700" text-anchor="middle" >6</text>
<text x="560" y="899" class="t1" font-size="14" font-weight="700" text-anchor="start" >A stop must be a waypoint first</text>
<text x="560" y="919" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >To stop in a town or at a café you make a</text>
<text x="560" y="937" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >waypoint elsewhere, then choose it here.</text>
<line x1="506" y1="972" x2="530" y2="972" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="540" cy="972" r="10" class="co"/>
<text x="540" y="976" class="cot" font-size="11" font-weight="700" text-anchor="middle" >7</text>
<text x="560" y="977" class="t1" font-size="14" font-weight="700" text-anchor="start" >Remove sits with the everyday</text>
<text x="560" y="997" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >Remove the itinerary is in the same row as</text>
<text x="560" y="1015" class="t2" font-size="12.5" font-weight="400" text-anchor="start" >Places along the way; Delete trip is in the header.</text>
</svg>
